<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A1 Scout · Organized AI</title>
<link rel="icon" type="image/png" href="brand/favicon.png">
<meta name="theme-color" content="#0b0b0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0a;--panel:#141412;--line:#2a2822;--ink:#f4f2ea;--mute:#9b978a;--accent:#fbe04d;--brand:#fbe04d;--on-brand:#0b0b0a;--warn:#ff9f5a;--bad:#f27c7c;--chip:#1c1b17;
 --c-models:#fbe04d;--c-datasets:#6cc4f2;--c-spaces:#f29c6c;--c-code:#b99cf2;--c-papers:#7cf2a0;--c-runs:#f27cc8;--c-wheels:#9a978c;--c-corpora:#6b685e;--c-tooling:#55524a;--c-other:#45433d}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#faf9f4;--panel:#fff;--line:#e4e1d6;--ink:#111110;--mute:#5f5b50;--accent:#8a6c00;--brand:#f5d528;--on-brand:#0b0b0a;--warn:#b25a00;--bad:#b42323;--chip:#f1efe6;
 --c-models:#e8c414;--c-datasets:#2b8fc4;--c-spaces:#d0702f;--c-code:#7d5bd0;--c-papers:#2fae63;--c-runs:#c2408f;--c-wheels:#8c887c;--c-corpora:#b3afa2;--c-tooling:#c7c3b6;--c-other:#d6d3c8}}
img.brand-wm-dark{display:none}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) img.brand-wm-light{display:none}:root:not([data-theme="dark"]) img.brand-wm-dark{display:inline}:root:not([data-theme="dark"]) .a1-track{box-shadow:inset 0 0 0 1px var(--line)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "IBM Plex Sans",system-ui,sans-serif}
code,pre,.mono{font-family:"IBM Plex Mono",monospace}
.wrap{max-width:1180px;margin:0 auto;padding:24px 16px 80px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.brand-icon{width:34px;height:34px;border-radius:9px;display:block;box-shadow:0 0 0 1px var(--line)}
.brand-wm{height:18px;width:auto;display:inline}
.brand-sep{width:1px;height:22px;background:var(--line)}
.a1bar{border-top:2px solid var(--brand) !important}
.foot{margin-top:56px;padding-top:16px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--mute);font:12px "IBM Plex Mono",monospace}
.foot img{height:12px;width:auto}
.foot a{color:var(--mute)}
.mark{font:600 13px "IBM Plex Mono",monospace;letter-spacing:.06em;border:1px solid var(--line);padding:2px 8px;border-radius:4px}
h1{font:600 24px/1.2 "IBM Plex Mono",monospace;margin:0}
.nav{margin-left:auto;display:flex;gap:6px}
.tab{background:var(--chip);border:1px solid var(--line);color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer;font:500 13px "IBM Plex Mono",monospace}
.tab[aria-pressed=true]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.sub{color:var(--mute);margin:8px 0 20px;max-width:760px}
.section{font:500 12px "IBM Plex Mono",monospace;color:var(--mute);letter-spacing:.12em;margin:24px 0 10px;text-transform:uppercase}
.drive{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--chip);border:1px solid var(--line)}
.drive i{display:block;height:100%;width:0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:8px}
.legend b{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle}
.mapgrid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;align-items:start}
.mapgrid>*{min-width:0}
@media (max-width:900px){.mapgrid{grid-template-columns:1fr}.card{position:static}}
.crumbs{font:500 13px "IBM Plex Mono",monospace;margin-bottom:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.crumbs button{background:none;border:0;color:var(--accent);cursor:pointer;font:inherit;padding:0}
.tm{position:relative;width:100%;aspect-ratio:16/10;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.cell{position:absolute;border:2px solid var(--bg);border-radius:6px;cursor:pointer;overflow:hidden;padding:8px;color:#0b0d0c;transition:filter .15s}
.cell:hover,.cell.sel{filter:brightness(1.12)}
.cell.sel{outline:2px solid var(--ink);outline-offset:-2px}
.cell .n{font:600 13px "IBM Plex Mono",monospace;word-break:break-all;line-height:1.25}
.cell .s{font-size:11px;opacity:.75}
.cell .g{position:absolute;right:7px;bottom:5px;font:600 11px "IBM Plex Mono",monospace;opacity:.6}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;position:sticky;top:14px}
.card h2{font:600 17px "IBM Plex Mono",monospace;margin:0 0 2px;word-break:break-all}
.card .kind{font:500 12px "IBM Plex Mono",monospace;color:var(--mute)}
.card h3{font:500 11px "IBM Plex Mono",monospace;color:var(--mute);letter-spacing:.12em;text-transform:uppercase;margin:14px 0 4px}
.card p{margin:0}
.facts{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}
.facts dt{color:var(--mute)} .facts dd{margin:0;font-family:"IBM Plex Mono",monospace;word-break:break-all}
pre{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;font-size:12px;overflow:auto;white-space:pre;margin:0;max-width:100%}
.wrap{overflow-x:clip}
.copy{float:right;margin:-2px 0 4px}
.learn{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--chip);border-radius:4px;padding:1px 7px;font-size:12px;border:1px solid transparent}
button.chip{cursor:pointer;color:var(--ink);font-family:inherit}
button.chip:hover{border-color:var(--accent)}
.chip.flag{color:var(--warn)}
.concepts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
.concept{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:14px}
.concept b{font-family:"IBM Plex Mono",monospace;font-size:13px;display:block;margin-bottom:4px}
.concept.hl{border-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.stat b{display:block;font:600 22px "IBM Plex Mono",monospace}
.stat span{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.themes{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}
.theme{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.theme .bar{height:4px;background:var(--chip);border-radius:2px;margin:8px 0 6px;overflow:hidden}
.theme .bar i{display:block;height:100%;background:var(--accent);width:0}
.theme small{color:var(--mute);font-family:"IBM Plex Mono",monospace;font-size:11px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.pick{display:grid;grid-template-columns:58px 1fr auto;gap:14px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:8px}
.score{font:600 20px "IBM Plex Mono",monospace;text-align:center;border:1px solid var(--line);border-radius:8px;padding:8px 0}
.repo{font:600 15px "IBM Plex Mono",monospace;word-break:break-all}
.repo a{color:inherit;text-decoration:none;border-bottom:1px dotted var(--mute)}
.meta{color:var(--mute);font-size:13px;margin-top:2px}
.summ{font-size:13px;margin-top:6px;max-width:680px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.st-approved,.st-stashed{color:var(--accent)} .st-skipped{color:var(--mute)}
.acts{display:flex;flex-direction:column;gap:6px}
.btn{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:6px;padding:6px 12px;cursor:pointer;font:500 13px "IBM Plex Mono",monospace;white-space:nowrap}
.btn.go{border-color:var(--accent);color:var(--accent)}
.btn:hover{background:var(--chip)}
.gate{max-width:420px;margin:12vh auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px}
.gate input{width:100%;padding:10px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-family:"IBM Plex Mono",monospace;margin:10px 0}
.empty{color:var(--mute);padding:30px 0;text-align:center}
.run{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--mute);margin-top:12px}
@media (max-width:620px){.pick{grid-template-columns:48px 1fr}.acts{grid-column:1/-1;flex-direction:row}.tm{aspect-ratio:3/4}}
  .a1bar { border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 12px 14px; margin: 0 0 18px; display: grid; gap: 8px; font-size: 13px; }
  .a1bar:empty { display: none; }
  .a1-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .a1-head b { font: 600 13px "IBM Plex Mono", monospace; }
  .a1-sub { color: var(--mute); }
  .a1-count { margin-left: auto; color: var(--mute); font: 12px "IBM Plex Mono", monospace; }
  .a1-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--mute); flex: none; }
  .a1bar[data-state="ok"] .a1-dot, .a1bar[data-state="busy"] .a1-dot { background: var(--brand); }
  .a1bar[data-state="busy"] .a1-dot { background: var(--accent); animation: a1pulse 1.4s ease-in-out infinite; }
  .a1bar[data-state="warn"] .a1-dot { background: var(--warn); }
  @keyframes a1pulse { 0%,100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent); } 50% { box-shadow: 0 0 0 6px transparent; } }
  .a1-line { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 5px; }
  .a1-line b { font-family: "IBM Plex Mono", monospace; overflow-wrap: anywhere; }
  .a1-nums { color: var(--mute); font: 12px "IBM Plex Mono", monospace; }
  .a1-track { height: 8px; border-radius: 4px; background: var(--chip); overflow: hidden; position: relative; }
  .a1-track i { display: block; height: 100%; background: var(--brand); border-radius: 4px; }
  .a1-track.indet i { width: 30%; position: absolute; animation: a1slide 1.6s ease-in-out infinite; }
  @keyframes a1slide { 0% { left: -30%; } 100% { left: 100%; } }
  .a1-last { color: var(--mute); }
  .a1-cta { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .a1-run-btn { --sheen: -60%; position: relative; overflow: hidden; display: inline-flex; align-items: center; gap: 10px; border: 0; border-radius: 10px; padding: 10px 16px 10px 12px; cursor: pointer;
    background: var(--brand); color: var(--on-brand); font: 600 14px "IBM Plex Mono", monospace; box-shadow: 0 0 0 0 transparent; transition: box-shadow .2s; }
  .a1-run-btn::after { content: ""; position: absolute; top: 0; bottom: 0; left: var(--sheen); width: 40%; background: linear-gradient(100deg, transparent, rgba(255,255,255,.55), transparent); pointer-events: none; }
  .a1-run-btn:hover:not([disabled]) { box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand) 30%, transparent); }
  .a1-run-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .a1-run-btn[disabled] { cursor: default; background: color-mix(in srgb, var(--brand) 55%, var(--panel)); }
  .a1-run-btn small { font: 500 11.5px "IBM Plex Mono", monospace; opacity: .75; border-left: 1px solid rgba(0,0,0,.25); padding-left: 10px; }
  .a1-run-ic { width: 22px; height: 22px; border-radius: 50%; background: var(--on-brand); display: grid; place-items: center; flex: none; }
  .a1-run-ic i { width: 0; height: 0; border-left: 7px solid var(--brand); border-top: 5px solid transparent; border-bottom: 5px solid transparent; margin-left: 2px; }
  .a1-run-btn[disabled] .a1-run-ic { background: transparent; border: 2px solid rgba(0,0,0,.25); }
  .a1-run-btn[disabled] .a1-run-ic i { width: 14px; height: 14px; border: 2px solid transparent; border-top-color: var(--on-brand); border-radius: 50%; margin: 0; }
  .a1-cta-note { color: var(--mute); font-size: 12.5px; max-width: 52ch; }
  .a1-cta-note.err { color: var(--bad); }
  .a1-run { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; }
  .a1-big b { display: block; font: 600 34px/1 "IBM Plex Mono", monospace; }
  .a1-big span { color: var(--mute); font-size: 12px; }
  .a1-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 6px 16px; margin: 0; }
  .a1-stats dt { color: var(--mute); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
  .a1-stats dd { margin: 0; font: 13px "IBM Plex Mono", monospace; }
  .a1-track.big { height: 12px; border-radius: 6px; }
  .a1-lists { display: grid; gap: 6px; }
  .a1-lists > div { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .a1-lbl { color: var(--mute); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; min-width: 92px; }
  .a1-chip.ok { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }
  .a1-foot { color: var(--mute); font-size: 11px; }
  @media (max-width: 620px) { .a1-run { grid-template-columns: 1fr; gap: 10px; justify-items: start; } .a1-lbl { min-width: 0; width: 100%; } }
  .a1-next { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; color: var(--mute); }
  .a1-chip { border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; color: var(--ink); font-size: 12px; }
  .a1-chip small { color: var(--mute); }
  .a1-chip.later { opacity: .6; }
  .a1-chip { display: inline-flex; gap: 4px; align-items: baseline; transition: transform .15s; }
  .a1-chip:hover { transform: translateY(-1px); }
  .a1-chip em { font-style: normal; color: var(--accent); display: inline-block; }
  .a1-dot { position: relative; }
  .a1-ripple { position: absolute; inset: 0; border-radius: 50%; background: var(--brand); opacity: 0; }
  .a1bar[data-state="busy"] .a1-dot { animation: none; }
  .a1-label { display: inline-block; }
  .a1-track i { position: relative; overflow: hidden; }
  .a1-track i::after { content: ""; position: absolute; right: 0; top: 0; bottom: 0; width: 10px; background: linear-gradient(90deg, transparent, color-mix(in srgb, #fff 45%, var(--accent))); border-radius: 0 4px 4px 0; opacity: .7; }
  .a1-sheen { position: absolute; inset: 0; width: 30%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent); pointer-events: none; }
  .a1-ringwrap { position: relative; width: 88px; height: 88px; }
  .a1-ringwrap svg { transform: rotate(-90deg); }
  .a1-ringwrap circle { fill: none; stroke-width: 7; }
  .a1-ringwrap .bg { stroke: var(--chip); }
  .a1-ringwrap .fg { stroke: var(--brand); stroke-linecap: round; filter: drop-shadow(0 0 4px color-mix(in srgb, var(--accent) 45%, transparent)); }
  .a1-ringtxt { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .a1-ringtxt b { font: 600 20px/1 "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; }
  .a1-ringtxt span { color: var(--mute); font-size: 10px; text-transform: uppercase; letter-spacing: .08em; margin-top: 3px; }
  .a1-stats dd { font-variant-numeric: tabular-nums; }
  .a1-nums { font-variant-numeric: tabular-nums; }
  .a1-flipnum { display: inline-block; }
  .a1-sparkcell dd { display: flex; align-items: center; gap: 8px; }
  .a1-sparkcell small { color: var(--mute); font-size: 11px; }
  .a1-spark-line .stroke { fill: none; stroke: var(--accent); stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
  .a1-spark-line .fill { fill: color-mix(in srgb, var(--accent) 16%, transparent); }
  .a1-spark-line circle { fill: var(--accent); }
  .a1-live { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-right: 6px; vertical-align: 1px; }
  .a1-spark { position: fixed; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: var(--brand); pointer-events: none; z-index: 50; }
  .a1-spark:nth-child(3n) { background: var(--ink); }
  .a1-spark:nth-child(3n+1) { width: 4px; height: 4px; border-radius: 1px; }
  .a1-more { font-size: 12px; }
  @media (prefers-reduced-motion: reduce) { .a1bar[data-state="busy"] .a1-dot, .a1-track.indet i { animation: none; } }
  .pick[data-pick] { cursor: pointer; transition: border-color .15s; }
  .pick[data-pick]:hover { border-color: var(--accent); }
  .pick[data-pick]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  ul.upd { margin: 6px 0 10px; padding-left: 18px; font-size: 13px; line-height: 1.6; }
  ul.upd b { font-weight: 600; }
</style>

<body>
<div class="wrap" id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="lessons.js"></script>
<script src="explain.js"></script>
<script src="map.js"></script>
<script>
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
let token = ""; try { token = localStorage.getItem("a1-scout-token") || ""; } catch {}
let view = "map", state = null, picks = [], catalog = null, filter = "new", path = [], selected = null;
const gb = b => b == null ? "size ?" : b >= 1e12 ? (b/1e12).toFixed(2)+" TB" : b >= 1e9 ? (b/1e9).toFixed(1)+" GB" : b >= 1e6 ? (b/1e6).toFixed(0)+" MB" : (b/1e3).toFixed(0)+" KB";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const color = id => `var(--c-${id in CATEGORY_INTRO ? id : "other"})`;

async function call(p, opts = {}) {
  const r = await fetch(p, { ...opts, headers: { authorization: "Bearer " + token, "content-type": "application/json" } });
  if (r.status === 401) { gate("That token didn't work."); throw new Error("unauthorized"); }
  return r.json();
}
function gate(msg = "") {
  $("#app").innerHTML = `<div class="gate"><span class="brand"><img class="brand-icon" src="brand/icon.jpg" alt="" width="34" height="34"><img class="brand-wm brand-wm-light" src="brand/wordmark-yellow.png" alt="Organized AI" width="70" height="18"><img class="brand-wm brand-wm-dark" src="brand/wordmark-black.png" alt="Organized AI" width="70" height="18"></span><h1 style="margin:14px 0 4px">A1 Scout</h1>
  <div class="sub">Paste the scout token from <code>~/.nvme-stash/scout.env</code>.</div>
  <input id="tok" type="password" placeholder="SCOUT_TOKEN" autocomplete="off"><button class="btn go" id="save">Open</button>
  <div class="meta" style="color:var(--bad)">${esc(msg)}</div></div>`;
  $("#save").onclick = () => { token = $("#tok").value.trim(); try { localStorage.setItem("a1-scout-token", token); } catch {} load(); };
  gsap.fromTo(".gate", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: .4, ease: "power2.out", clearProps: "all" });
}
async function load() {
  if (!token) return gate();
  [state, picks, catalog] = await Promise.all([call("/api/state"), call("/api/picks"), call("/api/catalog")]);
  render(true);
  pollActivity();
}
function shell(inner) {
  return `<div class="top"><a class="brand" href="https://github.com/organized-ai" title="Organized AI"><img class="brand-icon" src="brand/icon.jpg" alt="" width="34" height="34"><img class="brand-wm brand-wm-light" src="brand/wordmark-yellow.png" alt="Organized AI" width="70" height="18"><img class="brand-wm brand-wm-dark" src="brand/wordmark-black.png" alt="Organized AI" width="70" height="18"></a><span class="brand-sep"></span><span class="mark">A1</span><h1>${view === "map" ? "Drive map" : "Scout"}</h1>
   <div class="nav">${["map","scout"].map(v=>`<button class="tab" data-view="${v}" aria-pressed="${v===view}">${v==="map"?"Map":"Scout"+((state.counts||{}).new?` · ${state.counts.new}`:"")}</button>`).join("")}</div></div>
   <section id="a1bar" class="a1bar" aria-live="polite"></section>${inner}
   <footer class="foot"><img class="brand-wm-light" src="brand/wordmark-yellow.png" alt="Organized AI" width="47" height="12"><img class="brand-wm-dark" src="brand/wordmark-black.png" alt="Organized AI" width="47" height="12"><span>· A1 Scout · an Organized AI asset · Austin, TX</span><a href="https://github.com/organized-ai/a1-scout">source</a></footer>`;
}
function render(first) {
  $("#app").innerHTML = shell(view === "map" ? MapView.html(catalog) : scoutView());
  $$("[data-view]").forEach(b => b.onclick = () => { view = b.dataset.view; render(true); });
  view === "map" ? MapView.wire(first, () => render()) : wireScout(first);
  if (!render.introDone && !RM()) {
    render.introDone = true;

    gsap.from(el, { y: -10, opacity: 0, duration: .5, ease: "power2.out", clearProps: "transform,opacity" });
    gsap.from(el.querySelectorAll(".a1-stats > div, .a1-ringwrap"), { y: 10, opacity: 0, duration: .45, stagger: .06, delay: .15, ease: "power2.out", clearProps: "transform,opacity" });
    gsap.from(el.querySelectorAll(".a1-chip, .a1-more"), { scale: .7, opacity: 0, duration: .35, stagger: .035, delay: .4, ease: "back.out(2)", clearProps: "transform,opacity" });
  }
  // 3. state or phase changed: flip the label in, wash the panel
  if (o.prevKey && o.prevKey !== st.key) {
    gsap.from(el.querySelector(".a1-label"), { rotationX: -90, opacity: 0, transformOrigin: "50% 50% -8px", duration: .6, ease: "back.out(1.6)", clearProps: "transform,opacity" });
    gsap.fromTo(el, { backgroundColor: "var(--chip)" }, { backgroundColor: "var(--panel)", duration: 1, clearProps: "backgroundColor" });
  } else if (o.prevPhase && o.phase && o.prevPhase !== o.phase) {
    gsap.from(el.querySelector(".a1-phase"), { y: 8, opacity: 0, duration: .4, ease: "power2.out", clearProps: "transform,opacity" });
  }
  // 4. an item just finished: pop its chip, spark, bump the counter
  el.querySelectorAll(".a1-chip.new").forEach((c, k) => {
    gsap.fromTo(c, { scale: .4, opacity: 0 }, { scale: 1, opacity: 1, duration: .55, delay: .15 + k * .1, ease: "back.out(3)", clearProps: "transform,opacity",
      onStart: () => { const [x, y] = centerOf(c); burst(x, y, 12, 45); } });
    gsap.fromTo(c.querySelector("em"), { rotation: -180, scale: 0 }, { rotation: 0, scale: 1, duration: .6, delay: .3 + k * .1, ease: "back.out(2.5)" });
  });
  if (el.querySelector(".a1-chip.new")) {
    const n = el.querySelector('[data-k="items"]'); if (n) gsap.fromTo(n, { yPercent: -80, opacity: 0 }, { yPercent: 0, opacity: 1, duration: .45, ease: "back.out(2)" });
    const it = el.querySelector(".a1-item"); if (it) gsap.from(it, { x: 24, opacity: 0, duration: .5, ease: "power3.out", clearProps: "transform,opacity" });
  }
  // 5. ripple off the status dot while a run is going
  const rp = el.querySelector(".a1-ripple");
  if (rp && st.key === "busy") barLoops.push(gsap.fromTo(rp, { scale: 1, opacity: .6 }, { scale: 3.2, opacity: 0, duration: 1.6, repeat: -1, ease: "power2.out" }));
  // 6. run just finished: fill the ring, confetti off the bar
  if (o.prevKey === "busy" && !st.running) {
    const [x, y] = centerOf(el);
    burst(x, y, 36, 160);
    gsap.fromTo(el, { boxShadow: "0 0 0 0 color-mix(in srgb, var(--accent) 50%, transparent)" }, { boxShadow: "0 0 0 14px transparent", duration: 1.2, ease: "power2.out", clearProps: "boxShadow" });
  }
}
/* ---------------- scout ---------------- */
const KIND_LABEL = { model: "model", dataset: "dataset", space: "Space (app)", paper: "paper", collection: "collection" };
function scoutView() {
  const c = state.counts || {}, lr = state.last_run;
  const shown = picks.filter(p => filter === "all" || p.status === filter);
  return `<div class="sub">Hugging Face models, datasets, Spaces, papers and collections scored against ${state.repos} Organized-AI repos. Approved picks download to the A1 the next time it's plugged in. Approving a collection queues each of its items here for review.</div>
  <div class="stats">
    <div class="stat"><b data-n="${c.new||0}">0</b><span>to review</span></div>
    <div class="stat"><b data-n="${c.approved||0}">0</b><span>approved, waiting</span></div>
    <div class="stat"><b data-n="${c.stashed||0}">0</b><span>on the A1</span></div>
    <div class="stat"><b>${state.free_bytes!=null? gb(state.free_bytes):"—"}</b><span>A1 free at last mount</span></div>
  </div>
  <div class="run">${lr ? `Last scan ${new Date(lr.started).toLocaleString()} (${esc(lr.trigger)}): ${lr.candidates} candidates, ${lr.new_picks} new, ${lr.auto_approved} auto-approved${lr.note? " · "+esc(lr.note):""}` : "No scan yet."}
   · <button class="btn" id="scan" style="padding:2px 8px">Scan now</button></div>
  ${updatesBlock(state.updates)}
  <div class="section">What the repos are building</div>
  <div class="themes">${state.themes.slice().sort((a,b)=>b.weight-a.weight).map(t=>`<div class="theme"><div>${esc(t.label)}</div>
    <div class="bar"><i data-w="${t.weight}"></i></div><small>${t.repos.slice(0,6).map(esc).join(" · ")||"no matching repos"}</small></div>`).join("")}</div>
  <div class="section">Picks</div>
  <div class="tabs">${["new","approved","stashed","skipped","all"].map(f=>`<button class="tab" data-f="${f}" aria-pressed="${f===filter}">${f}${f!=="all"?" "+(c[f]||0):""}</button>`).join("")}</div>
  <div id="list">${shown.length? shown.map(row).join("") : `<div class="empty">Nothing here.</div>`}</div>`;
}
// The agent's last check of stashed items against the Hub (runs on every A1 mount).
function updatesBlock(u) {
  if (!u || !u.checked_at) return "";
  const li = (arr, f) => arr && arr.length ? `<ul class="upd">${arr.slice(0, 12).map(f).join("")}</ul>` : "";
  const short = s => esc(String(s || "").slice(0, 7));
  return `<div class="section">Updates to what's on the A1</div>
  <div class="run">Checked ${new Date(u.checked_at).toLocaleString()}: ${u.tracked} tracked items, ${u.current} up to date${u.untracked ? `, ${u.untracked} not traceable to a Hub revision` : ""}.
    Older versions are kept in <code>stash/versions/</code>, never overwritten.</div>
  ${li(u.updated, x => `<li><b>Updated</b> ${esc(x.repo)} ${short(x.from)} → ${short(x.to)} · ${gb(x.bytes)} · old copy at ${esc(x.previous_path)}</li>`)}
  ${li(u.waiting, x => `<li><b>Update waiting</b> ${esc(x.repo)} ${short(x.from)} → ${short(x.to)} · ${esc(x.why)}</li>`)}
  ${li(u.successors, x => `<li><b>Newer release</b> ${esc(x.repo)} (successor of ${esc(x.of)})${x.approved ? " · auto-approved" : " · in picks to review"}</li>`)}
  ${li(u.docs_only, x => `<li>Docs-only change: ${esc(x.repo)} ${short(x.from)} → ${short(x.to)} (nothing to download)</li>`)}`;
}
function hubUrl(p) {
  return p.kind === "dataset" ? `https://huggingface.co/datasets/${p.repo}` : p.kind === "space" ? `https://huggingface.co/spaces/${p.repo}`
    : p.kind === "paper" ? `https://huggingface.co/papers/${p.repo}` : p.kind === "collection" ? `https://huggingface.co/collections/${p.repo}` : `https://huggingface.co/${p.repo}`;
}
function row(p) {
  const approveLabel = p.kind === "collection" ? "Queue items" : "Approve";
  const btns = p.status === "stashed" ? "" : p.status === "approved"
    ? `<button class="btn" data-act="new" data-id="${esc(p.id)}">Unapprove</button>`
    : `<button class="btn go" data-act="approved" data-id="${esc(p.id)}">${approveLabel}</button>${p.status!=="skipped"?`<button class="btn" data-act="skipped" data-id="${esc(p.id)}">Skip</button>`:""}`;
  const items = p.kind === "collection" && p.extra?.items ? `<div class="meta" style="margin-top:6px">${p.extra.items.slice(0,6).map(i=>`${esc(i.type)}: ${esc(i.id)}`).join(" · ")}${p.extra.items.length>6?" …":""}</div>` : "";
  return `<div class="pick" tabindex="0" role="button" aria-label="Learn about ${esc(p.title || p.repo)}" data-pick="${esc(p.id)}"><div class="score">${Math.round(p.score)}</div>
   <div><div class="repo"><a href="${hubUrl(p)}" target="_blank" rel="noopener">${esc(p.title || p.repo)}</a></div>
   <div class="meta">${KIND_LABEL[p.kind]||p.kind}${p.title?` · ${esc(p.repo)}`:""}${p.kind!=="paper"&&p.kind!=="collection"?` · ${gb(p.size_bytes)}`:""}${p.license?` · ${esc(p.license)}`:""}${p.extra?.sdk?` · ${esc(p.extra.sdk)}`:""}${p.auto?" · auto-approved":""}${p.stash_path?" · "+esc(p.stash_path):""}</div>
   ${p.summary && p.kind!=="model"?`<div class="summ">${esc(p.summary.slice(0,260))}${p.summary.length>260?"…":""}</div>`:""}
   <div class="chips"><span class="chip st-${p.status}">${p.status}</span>${p.kind==="model"&&p.size_bytes&&window.MachineFit?(window.MachineFit(p.size_bytes,p.repo).filter(x=>x.fits).map(x=>`<span class="chip">fits ${x.label}</span>`).join("")||'<span class="chip flag">fits none of your Macs</span>'):""}${p.reasons.map(r=>`<span class="chip">${esc(r)}</span>`).join("")}${p.flags.map(f=>`<span class="chip flag">${esc(f)}</span>`).join("")}</div>
   ${items}${p.matched_repos.length?`<div class="meta" style="margin-top:6px">For: ${p.matched_repos.map(esc).join(", ")}</div>`:""}</div>
   <div class="acts">${btns}</div></div>`;
}
function wireScout(first) {
  $$(".tabs .tab").forEach(b => b.onclick = () => { filter = b.dataset.f; render(); });
  $$("[data-act]").forEach(b => b.onclick = e => { e.stopPropagation(); act(b.dataset.id, b.dataset.act, b.closest(".pick")); });
  // Clicking a pick (anywhere but its buttons and links) opens an info card that flips over.
  const openPick = el => { const p = picks.find(x => x.id === el.dataset.pick); if (p) MapView.pickCard({ ...p, hub: hubUrl(p) }, el, status => act(p.id, status, el)); };
  $$("[data-pick]").forEach(el => {
    el.onclick = e => { if (!e.target.closest("button, a")) openPick(el); };
    el.onkeydown = e => { if ((e.key === "Enter" || e.key === " ") && e.target === el) { e.preventDefault(); openPick(el); } };
  });
  $("#scan").onclick = async e => { e.target.textContent = "Scanning…"; await call("/api/scan?trigger=page", { method: "POST" }); await load(); view = "scout"; render(); };
  $$(".bar i").forEach(i => gsap.to(i, { width: (i.dataset.w*100)+"%", duration: first ? 1 : .3, ease: "power3.out" }));
  $$("[data-n]").forEach(el => { const o = { v: first ? 0 : +el.dataset.n }; gsap.to(o, { v: +el.dataset.n, duration: first ? .9 : 0, onUpdate: () => el.textContent = Math.round(o.v) }); });
  gsap.fromTo(".pick", { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: .3, stagger: { each: .02, amount: .5 }, ease: "power2.out", clearProps: "all" });
  if (first) gsap.fromTo(".stat,.theme", { y: 8, opacity: 0 }, { y: 0, opacity: 1, duration: .3, stagger: .03, clearProps: "all" });
}
async function act(id, status, el) {
  await gsap.to(el, { x: status === "skipped" ? -30 : 30, opacity: 0, duration: .25, ease: "power2.in" });
  const r = await call("/api/picks/status", { method: "POST", body: JSON.stringify({ id, status }) });
  if (r.expanded) { picks = await call("/api/picks"); }
  else { const p = picks.find(x => x.id === id); if (p) p.status = status; }
  state.counts = picks.reduce((a, x) => (a[x.status] = (a[x.status]||0)+1, a), {});
  render();
}
load();
</script>
